name: Luminote Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Set version
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > luminote-release.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/luminote-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "Luminote-${GITHUB_REF_NAME}.apk"

      - name: Build update manifest
        run: |
          if [[ "${GITHUB_REF_NAME}" == *.qa.* ]]; then
            channel="qa"
          elif [[ "${GITHUB_REF_NAME}" == *.dev.* ]]; then
            channel="dev"
          else
            channel="stable"
          fi

          apk_name="Luminote-${GITHUB_REF_NAME}.apk"
          apk_sha256=$(sha256sum "$apk_name" | awk '{print $1}')
          cat > luminote-update.json <<EOF
          {"schema":1,"tag":"${GITHUB_REF_NAME}","channel":"${channel}","versionName":"${GITHUB_REF_NAME#v}","versionCode":${GITHUB_RUN_NUMBER},"apkName":"${apk_name}","sha256":"${apk_sha256}"}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Luminote-${{ github.ref_name }}.apk
            luminote-update.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '.qa.') || contains(github.ref_name, '.dev.') }}
